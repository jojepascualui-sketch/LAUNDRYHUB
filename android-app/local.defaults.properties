# Committed defaults for the Secrets Gradle Plugin. NO REAL VALUES here.
# Put the real ones in local.properties (git-ignored), which overrides this file.
# Without a real key the map stays blank and "Continue with Google" says it is not set up.
MAPS_API_KEY=DEFAULT_API_KEY
GOOGLE_WEB_CLIENT_ID=
# Backend root ending in "/" (emulator default).
API_BASE_URL=http://10.0.2.2:8080/api/
# Deployed HTTPS API for release builds (or set LAUNDRYHUB_API_URL).
RELEASE_API_BASE_URL=
