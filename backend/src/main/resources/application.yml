# Secrets and connection details come from environment variables only.
# For local development you may put them in backend/.env (git-ignored, see .env.example).
spring:
  application:
    name: laundryhub-backend
  config:
    import: optional:file:.env[.properties]
  # Supabase Postgres (docs/DEPLOYMENT.md): use the Session pooler connection string, e.g.
  # jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Supabase's free pooler allows few connections; keep the pool small.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # Tables live in their own schema, not "public", so Supabase's Data API never exposes them.
        default_schema: ${DB_SCHEMA:laundryhub}
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
  flyway:
    enabled: true
    # Creates the schema on the first start and migrates inside it.
    default-schema: ${DB_SCHEMA:laundryhub}
    schemas: ${DB_SCHEMA:laundryhub}
    # db/sample-data loads the orders and customers shown in the admin design (A1/A2).
    # Set FLYWAY_LOCATIONS=classpath:db/migration to start with an empty shop.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/sample-data}

server:
  port: ${PORT:8080}
  # Behind Render / Railway's HTTPS proxy: trust X-Forwarded-* so redirects and links use https.
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # /actuator/health (database included), /actuator/health/liveness and /readiness for the host.
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

laundryhub:
  security:
    # HS256 key, at least 32 characters. Blank = a random key per start (tokens die on restart).
    # Hosting dashboards use JWT_SECRET; LAUNDRYHUB_JWT_SECRET still works locally.
    jwt-secret: ${JWT_SECRET:${LAUNDRYHUB_JWT_SECRET:}}
    token-hours: ${LAUNDRYHUB_TOKEN_HOURS:12}
    # OAuth client id the Android app uses for "Continue with Google". Blank = Google sign-in off.
    # Same value as the Android app's GOOGLE_WEB_CLIENT_ID (either name works here).
    google-client-id: ${GOOGLE_WEB_CLIENT_ID:${GOOGLE_OAUTH_CLIENT_ID:}}
  geocoding:
    # Server-side Google key (Geocoding API). Blank = addresses are not filled in from the pin.
    api-key: ${GOOGLE_SERVER_KEY:}
  maps:
    # Maps JavaScript API key for the admin console's A2 map page (/api/maps/order-pin). Blank = plain frame.
    js-key: ${MAPS_JS_KEY:}
  shop:
    # Shop position for the delivery radius. Blank = use the position saved in shop_settings.
    lat: ${SHOP_LAT:}
    lng: ${SHOP_LNG:}
  web:
    # Website origins allowed to call the API from the browser (comma-separated). Vercel previews: https://*.vercel.app
    allowed-origins: ${WEB_ORIGINS:http://localhost:5173}
  admin:
    # First admin account, created on startup when no admin exists yet.
    email: ${ADMIN_DEFAULT_EMAIL:admin@laundryhub.ph}
    default-password: ${ADMIN_DEFAULT_PASSWORD:}
